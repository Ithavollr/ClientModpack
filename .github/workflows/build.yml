name: Prism Pack Build
on:
  push:
    branches: [ "seed" ]
  pull_request:
    branches: [ "seed" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 'wrapper'

      - name: Build
        run: ./gradlew buildPrismPack --stacktrace

      # === Version-file-driven release: a push that bumps the top-level
      # `version = "..."` in pack.toml gets tagged and released automatically;
      # any other push (tag already exists) is a plain CI run. No manual tagging.
      - name: Read version
        if: github.event_name == 'push'
        id: version
        run: echo "version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' pack.toml)" >> "$GITHUB_OUTPUT"

      - name: Check for existing release tag
        if: github.event_name == 'push'
        id: tag_exists
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "ERROR: no top-level version line found in pack.toml"
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/v$VERSION" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: github.event_name == 'push' && steps.tag_exists.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: build/Iffy.zip
